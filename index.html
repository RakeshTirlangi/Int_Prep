## 14. Operating Systems & Computer Networks

*(Usually 2–4 quick questions or MCQs.)*

### Operating Systems
1. **What is an OS?** Software that manages hardware and provides services to programs: process management, memory management, file system, I/O, security.

2. **Process vs Thread?** Process: independent program in execution with its own address space; heavy context switch. Thread: lightweight unit within a process, shares memory; cheaper to create/switch.

3. **Process states?** New → Ready → Running → Waiting/Blocked → Terminated.

4. **CPU scheduling algorithms?** FCFS, SJF (shortest job first), Priority, **Round Robin** (time quantum, fair, used in time-sharing), Multilevel queue. Terms: turnaround time = completion − arrival; waiting time = turnaround − burst.

5. **Deadlock — 4 necessary conditions (Coffman)?** **Mutual exclusion, Hold and wait, No preemption, Circular wait.** Break any one to prevent deadlock. **Banker's algorithm** avoids deadlock.

6. **Mutex vs Semaphore?** Mutex: lock, one owner at a time, released by the owner. Semaphore: counter allowing up to N threads (binary semaphore ≈ mutex, but no ownership).

7. **Paging, segmentation, virtual memory?** **Paging** — memory split into fixed-size pages/frames (no external fragmentation). **Segmentation** — variable-sized logical segments (code, stack). **Virtual memory** — uses disk to give the illusion of more RAM; **page fault** when a page isn't in RAM; **thrashing** when the system spends more time swapping than executing. Page replacement: FIFO, LRU, Optimal.

8. **Internal vs external fragmentation?** Internal — wasted space inside an allocated block. External — free memory scattered in small chunks.

9. **What is a race condition / critical section?** Race — result depends on thread timing on shared data. Critical section — code accessing shared resources; protect with locks.

### Computer Networks
10. **OSI model (7 layers)?** **P**hysical, **D**ata link, **N**etwork, **T**ransport, **S**ession, **P**resentation, **A**pplication — mnemonic "**P**lease **D**o **N**ot **T**hrow **S**ausage **P**izza **A**way". TCP/IP model has 4: Network Access, Internet, Transport, Application.

    - **Application:** HTTP, HTTPS, FTP, SMTP, DNS
    - **Transport:** TCP, UDP (ports)
    - **Network:** IP, ICMP, routers
    - **Data link:** Ethernet, MAC address, switches
    - **Physical:** cables, hubs, bits

11. **TCP vs UDP?**
    - **TCP:**
       - Connection-oriented (3-way handshake)
       - Reliable, ordered, retransmits
       - Slower
       - Web, email, file transfer
    - **UDP:**
       - Connectionless
       - No guarantee
       - Faster
       - Video calls, gaming, DNS, live streaming

12. **IP address, MAC address, DNS, DHCP?** IP — logical network address (IPv4 32-bit, IPv6 128-bit). MAC — 48-bit physical hardware address. DNS — converts domain names to IP addresses. DHCP — automatically assigns IPs.

13. **Common ports?** HTTP 80, HTTPS 443, FTP 21, SSH 22, SMTP 25, DNS 53, MySQL 3306, SQL Server 1433, PostgreSQL 5432.

14. **Firewall, VPN, proxy, load balancer?** Firewall — filters traffic by rules. VPN — encrypted tunnel over the public internet. Proxy — intermediary for requests. Load balancer — spreads traffic across servers (round robin, least connections).

## 15. Cloud Computing Basics

QualiZeal trains interns in Cloud. Basic awareness + curiosity is enough; a free-tier hands-on (deploying a small API) is a big bonus to mention.

1. **What is cloud computing?** On-demand delivery of computing resources (servers, storage, databases, networking, AI) over the internet with **pay-as-you-go** pricing, instead of buying and maintaining your own data centre.

2. **Benefits?** No upfront hardware cost, **scalability/elasticity** (scale up or down automatically), high availability across regions, global reach, managed services, faster time to market.

3. **Service models — IaaS, PaaS, SaaS (most common cloud question)**
   - **IaaS:**
      - *You manage:* OS, runtime, app, data
      - *Provider manages:* Hardware, virtualization, network
      - *Examples:* AWS EC2, Azure Virtual Machines, Google Compute Engine
   - **PaaS:**
      - *You manage:* Your app & data
      - *Provider manages:* OS, runtime, scaling
      - *Examples:* Azure App Service, AWS Elastic Beanstalk, Google App Engine
   - **SaaS:**
      - *You manage:* Just use it
      - *Provider manages:* Everything
      - *Examples:* Gmail, Microsoft 365, Salesforce, Zoom
   - **FaaS / Serverless:**
      - *You manage:* Only function code
      - *Provider manages:* Servers, scaling (pay per execution)
      - *Examples:* AWS Lambda, Azure Functions

   Pizza analogy: IaaS = buy ingredients & bake at home in a rented kitchen; PaaS = takeaway pizza you serve; SaaS = dine at the restaurant.

4. **Deployment models?** **Public** (shared provider infrastructure), **Private** (dedicated to one organisation), **Hybrid** (mix of on-premises/private + public), **Multi-cloud** (multiple providers).

5. **Major providers & equivalent services**
   - **Virtual machines:** AWS: EC2 · Azure: Virtual Machines · GCP: Compute Engine
   - **Object storage:** AWS: S3 · Azure: Blob Storage · GCP: Cloud Storage
   - **Managed SQL:** AWS: RDS · Azure: Azure SQL Database · GCP: Cloud SQL
   - **NoSQL:** AWS: DynamoDB · Azure: Cosmos DB · GCP: Firestore/Bigtable
   - **Serverless:** AWS: Lambda · Azure: Functions · GCP: Cloud Functions/Run
   - **Kubernetes:** AWS: EKS · Azure: AKS · GCP: GKE
   - **Identity:** AWS: IAM · Azure: Entra ID (formerly Azure AD) · GCP: Cloud IAM
   - **AI services:** AWS: Bedrock, SageMaker · Azure: Azure OpenAI / AI Foundry · GCP: Vertex AI

   *(For a .NET-focused company, **Azure** knowledge is especially relevant.)*

6. **Region vs Availability Zone?** Region = geographic area (e.g., Mumbai). Availability Zone = isolated data centre(s) within a region; deploying across AZs gives fault tolerance.

7. **Scaling — vertical vs horizontal?** Vertical (scale up) = bigger machine. Horizontal (scale out) = more machines behind a load balancer (preferred in cloud; **auto-scaling**).

8. **Virtualization vs Containers vs Kubernetes?**
   - **VM** — full OS per virtual machine (heavier, minutes to boot).
   - **Container (Docker)** — packages app + dependencies, shares the host OS kernel (lightweight, seconds to start, "works on my machine" problem solved).
   - **Kubernetes** — orchestrates containers: deployment, scaling, self-healing, load balancing.
   ```dockerfile
   # Example Dockerfile for a .NET 8 API
   FROM mcr.microsoft.com/dotnet/aspnet:8.0
   WORKDIR /app
   COPY ./publish .
   ENTRYPOINT ["dotnet", "MyApi.dll"]
   ```

9. **What is DevOps / CI/CD?** DevOps = culture + practices that join development and operations for faster, reliable delivery. **CI** (Continuous Integration) — every commit is built and tested automatically. **CD** (Continuous Delivery/Deployment) — automatically release to staging/production. Tools: GitHub Actions, Azure DevOps, Jenkins, GitLab CI. In a QE company, **automated tests run inside the CI/CD pipeline** — that's "shift-left" testing.

10. **Shared responsibility model?** Provider secures the cloud *infrastructure*; the customer secures *what they put in it* (data, access permissions, configurations).

11. **Cloud security basics?** IAM with **least privilege**, MFA, encryption at rest and in transit, secret managers (Key Vault/Secrets Manager), network security groups, monitoring/logging.

12. **CapEx vs OpEx?** Cloud converts capital expenditure (buying servers) into operational expenditure (monthly usage bills).

## 16. AI / ML / Generative AI Basics

QualiZeal calls itself "AI-native" and trains interns in AI. Expect a few awareness questions. Speak simply, give examples, and connect AI to **software testing**.

1. **AI vs ML vs Deep Learning vs Generative AI?**
   - **AI** — machines performing tasks that need human-like intelligence (broadest).
   - **Machine Learning** — subset of AI; systems **learn patterns from data** instead of explicit rules.
   - **Deep Learning** — subset of ML using multi-layer **neural networks** (images, speech, language).
   - **Generative AI** — models that **create new content** (text, code, images): ChatGPT, Claude, Gemini, Copilot.

2. **Types of machine learning?**
   - **Supervised:**
      - *Data:* Labelled (input → known output)
      - *Example:* Spam detection, house-price prediction. *Classification* (category) vs *Regression* (number)
   - **Unsupervised:**
      - *Data:* Unlabelled
      - *Example:* Customer segmentation (clustering — K-Means)
   - **Reinforcement:**
      - *Data:* Rewards/penalties from an environment
      - *Example:* Game-playing agents, robotics

3. **Common algorithms (names + one line)?** Linear regression (predict numbers), Logistic regression (yes/no classification), Decision tree / Random forest, KNN, SVM, K-Means clustering, Naive Bayes, Neural networks.

4. **Training vs testing data; overfitting vs underfitting?**
   Split data (e.g., 80/20) to check generalisation. **Overfitting** — memorises training data, fails on new data (fix: more data, regularisation, simpler model, cross-validation). **Underfitting** — too simple, poor even on training data.

5. **Evaluation metrics?** Accuracy, **Precision** (of the predicted positives, how many are right), **Recall** (of actual positives, how many we found), F1-score, confusion matrix. *Example:* in fraud detection, recall matters (don't miss fraud).

6. **What is an LLM?** A **Large Language Model** — a deep-learning model (based on the **Transformer** architecture) trained on huge text data to predict the next token; can answer questions, summarise, write code. Examples: GPT (OpenAI), Claude (Anthropic), Gemini (Google), Llama (Meta).

7. **Key GenAI terms**
   - **Prompt / prompt engineering** — crafting clear instructions, context and examples to get better output.
   - **Token** — a chunk of text the model processes; **context window** = how many tokens it can consider at once.
   - **Hallucination** — confident but wrong output → always verify.
   - **RAG (Retrieval-Augmented Generation)** — fetch relevant documents (often from a **vector database** using **embeddings**) and give them to the LLM so it answers from your data.
   - **Fine-tuning** — further training a model on specific data.
   - **AI agents** — LLMs that can plan and use tools (call APIs, run code, browse) to finish multi-step tasks.
   - **Embeddings** — numeric vectors that capture meaning; similar text → nearby vectors.

8. **How is AI used in software testing / Quality Engineering? (connect to QualiZeal!)**
   - **Test case generation** from requirements/user stories using LLMs.
   - **Self-healing test automation** — when a UI element's locator changes, AI finds the element anyway.
   - **Test data generation** (synthetic, privacy-safe data).
   - **Defect prediction** — ML predicts risky modules to test first (risk-based testing).
   - **Visual testing** — AI compares screenshots for UI regressions.
   - **Log analysis & root-cause suggestions**, flaky-test detection.
   - **Testing AI systems themselves** — checking LLM apps for accuracy, bias, hallucination, safety, prompt injection.
   QualiZeal's **QMentisAI™** is a GenAI-powered platform for AI-driven testing — mentioning it shows research.

9. **Have you used AI tools? How do you use them responsibly?** Example answer: *"I use ChatGPT/Claude/Copilot to understand concepts, generate boilerplate and test ideas, but I always read and test the code myself, never paste confidential data, and treat the output as a suggestion, not the truth."*

10. **Ethical issues in AI?** Bias in training data, privacy, transparency/explainability, job impact, misinformation/deepfakes, security (prompt injection). Responsible AI = fairness, accountability, transparency, privacy, safety.

11. **Python for AI?** Libraries: NumPy, Pandas (data), Matplotlib (plots), scikit-learn (classic ML), TensorFlow/PyTorch (deep learning). .NET has **ML.NET** and **Semantic Kernel** (for LLM apps); Java has Spring AI / LangChain4j.

## 17. Software Testing & Quality Engineering

**QualiZeal is a Quality Engineering company — testing questions are very likely even in a developer interview.** Many freshers skip this; knowing it sets you apart.

1. **What is software testing? Why is it needed?** Evaluating software to find defects and verify it meets requirements. Needed because bugs cost money, reputation and safety; the later a bug is found, the costlier it is to fix.

2. **Quality Assurance vs Quality Control vs Testing vs Quality Engineering?**
   - **QA** — *process-oriented*, prevents defects (standards, reviews).
   - **QC** — *product-oriented*, finds defects in the product.
   - **Testing** — an activity within QC.
   - **Quality Engineering (QE)** — the modern approach: quality built in across the whole lifecycle — automation, CI/CD, performance, security, AI — owned by the whole team, not just at the end. ← *QualiZeal's business.*

3. **Verification vs Validation?** Verification — "Are we building the product **right**?" (reviews, walkthroughs — static). Validation — "Are we building the **right product**?" (executing tests — dynamic).

4. **Error vs Defect/Bug vs Failure?** Error — human mistake in code. Defect/Bug — the flaw in the software. Failure — the system deviating from expected behaviour at runtime.

5. **STLC (Software Testing Life Cycle)?** Requirement analysis → Test planning → Test case design → Test environment setup → Test execution → Test closure.

6. **Bug life cycle?** New → Assigned → Open → Fixed → Retest → **Verified → Closed**; or Reopened if still failing. Other states: Rejected, Duplicate, Deferred, Not a bug.

7. **Severity vs Priority (classic)**
   - **Severity** — impact on the system (set by tester). **Priority** — how soon to fix (set by product/manager).
   - **High severity, low priority:** app crashes on a rarely used legacy report page.
   - **Low severity, high priority:** company name/logo misspelled on the home page.
   - **High–High:** payment fails for all users. **Low–Low:** spelling mistake in a help page.

8. **Levels of testing?** **Unit** (single function/class, by developers) → **Integration** (modules together) → **System** (whole app vs requirements) → **Acceptance/UAT** (by client/users; alpha & beta).

9. **Types of testing**
   - **Functional:** smoke, sanity, regression, integration, UAT.
   - **Non-functional:** performance (load, stress, spike, endurance), security, usability, **accessibility**, compatibility, reliability.
   - **Smoke vs Sanity:** Smoke — broad, shallow check that the build's critical features work ("is it stable enough to test?"). Sanity — narrow, focused check that a specific fix/feature works.
   - **Regression testing** — re-run tests after changes to ensure nothing else broke (ideal for automation).
   - **Retesting** — re-run the failed test to confirm a specific bug is fixed.

10. **Black-box vs White-box vs Grey-box?** Black-box — test via inputs/outputs without seeing code. White-box — based on code structure (statement/branch coverage). Grey-box — partial knowledge.

11. **Test design techniques**
    - **Equivalence partitioning** — divide inputs into classes; test one from each. *Age field 18–60:* classes <18, 18–60, >60.
    - **Boundary Value Analysis** — test at edges: 17, 18, 19, 59, 60, 61.
    - **Decision table** — combinations of conditions (e.g., login: valid/invalid user × valid/invalid password).
    - **State transition** — e.g., ATM card blocked after 3 wrong PINs.
    - **Error guessing** — experience-based (empty input, special characters, very long strings).

12. **Write test cases for a login page (very common!)**
    1. Valid username + valid password → *Expected:* Redirect to dashboard
    2. Valid username + wrong password → *Expected:* Error "Invalid credentials" (don't reveal which one is wrong)
    3. Unregistered username → *Expected:* Same generic error
    4. Both fields empty → *Expected:* Validation messages
    5. Password field masking → *Expected:* Characters shown as dots
    6. 3–5 wrong attempts → *Expected:* Account locked / CAPTCHA
    7. SQL injection `' OR '1'='1` in username → *Expected:* Rejected safely
    8. Leading/trailing spaces, case sensitivity → *Expected:* As per requirement
    9. "Forgot password" link → *Expected:* Reset flow works
    10. Session after logout + browser back button → *Expected:* Must not access dashboard
    11. Enter key submits the form; Tab order works → *Expected:* Usability/accessibility
    12. Response time under load → *Expected:* Within SLA (e.g., < 2 s)

    Also be ready for: test cases for a **pen, lift/elevator, ATM, Amazon cart, a water bottle** — think functional, boundary, negative, usability, performance, security.

13. **Manual vs Automation testing — when to automate?** Automate repetitive, stable, high-value tests (regression, smoke, data-driven, cross-browser, API). Keep manual for exploratory, usability, ad-hoc, and features that change frequently.

14. **Automation tools you should know by name**
    - **Web UI:** **Selenium WebDriver**, **Playwright**, Cypress
    - **Mobile:** Appium
    - **API:** Postman, RestAssured (Java), Karate
    - **Unit testing:** JUnit/TestNG (Java), **xUnit/NUnit/MSTest** (C#), Mockito/Moq (mocking)
    - **BDD:** **Cucumber** (Java), Reqnroll/SpecFlow (.NET) — Gherkin *Given/When/Then*
    - **Performance:** JMeter, k6, Gatling, LoadRunner
    - **Test management / bugs:** Jira, TestRail, Azure DevOps
    - **CI/CD:** Jenkins, GitHub Actions, Azure DevOps

15. **Selenium basics**
    - Components: WebDriver, IDE, Grid (parallel/remote execution).
    - **Locators:** id, name, className, tagName, linkText, partialLinkText, **CSS selector**, **XPath** (absolute `/html/body/...` — fragile; relative `//input[@id='email']` — preferred).
    - **Waits:** implicit (global), **explicit** (`WebDriverWait` until a condition — preferred), fluent. Avoid `Thread.sleep`.
    - `findElement` (throws `NoSuchElementException`) vs `findElements` (returns an empty list).
    - **Page Object Model (POM)** — one class per page with its locators and actions → reusable, maintainable tests.
    ```java
    // Java + Selenium + JUnit 5 example
    WebDriver driver = new ChromeDriver();
    driver.get("https://example.com/login");
    driver.findElement(By.id("username")).sendKeys("asha");
    driver.findElement(By.id("password")).sendKeys("secret");
    driver.findElement(By.cssSelector("button[type='submit']")).click();
    new WebDriverWait(driver, Duration.ofSeconds(10))
        .until(ExpectedConditions.urlContains("/dashboard"));
    assertTrue(driver.getCurrentUrl().contains("/dashboard"));
    driver.quit();
    ```

16. **Unit testing example (shows you write quality code as a developer)**
    ```csharp
    // xUnit (C#) — Arrange, Act, Assert
    public class CalculatorTests
    {
        [Fact]
        public void Add_TwoNumbers_ReturnsSum()
        {
            var calc = new Calculator();        // Arrange
            int result = calc.Add(2, 3);        // Act
            Assert.Equal(5, result);            // Assert
        }

        [Theory]
        [InlineData(0, 0, 0)]
        [InlineData(-1, 1, 0)]
        public void Add_Various(int a, int b, int expected) =>
            Assert.Equal(expected, new Calculator().Add(a, b));
    }
    ```
    ```java
    // JUnit 5 (Java)
    @Test
    void add_twoNumbers_returnsSum() {
        assertEquals(5, new Calculator().add(2, 3));
    }
    ```
    Terms: **mocking** (fake dependencies), **code coverage**, **TDD** (write a failing test → make it pass → refactor: *Red-Green-Refactor*).

17. **What is a test plan / test case / test scenario?** Test plan — document: scope, approach, resources, schedule, entry/exit criteria, risks. Test scenario — *what* to test (high level: "verify login"). Test case — detailed steps, data, expected result.

18. **Shift-left vs shift-right testing?** Shift-left — test earlier (unit tests, code reviews, testing in CI). Shift-right — test/monitor in production (A/B testing, canary releases, observability).

19. **Performance testing types?** **Load** (expected users), **Stress** (beyond limits to find breaking point), **Spike** (sudden surge), **Endurance/Soak** (long duration — memory leaks), **Scalability**.

20. **Accessibility testing?** Ensuring people with disabilities can use the app (screen readers, keyboard navigation, colour contrast, alt text) — standard: **WCAG**. QualiZeal lists accessibility testing as a service.

21. **Why should a developer care about testing?** Bugs found early are cheap to fix; tests act as a safety net for refactoring; clean, testable code (DI, small methods) is better code. *Great line for the interview:* "In a quality-engineering company, I'd like to be a developer who thinks like a tester."

## 18. SDLC, Agile, Git

1. **SDLC phases?** Requirement gathering & analysis → Design → Implementation (coding) → Testing → Deployment → Maintenance.

2. **SDLC models?**
   - **Waterfall** — sequential; good for fixed, clear requirements; late feedback.
   - **V-Model** — each development phase has a matching testing phase (verification ↔ validation).
   - **Iterative / Spiral** — repeated cycles; spiral emphasises risk analysis.
   - **Agile** — short iterations, continuous feedback, working software early. Most companies (including QE firms) work Agile.

3. **Agile Manifesto values?** Individuals & interactions over processes & tools; working software over comprehensive documentation; customer collaboration over contract negotiation; responding to change over following a plan.

4. **Scrum?**
   - **Roles:** Product Owner (owns backlog/priorities), Scrum Master (facilitator, removes blockers), Developers (cross-functional team).
   - **Events:** Sprint (1–4 weeks), Sprint Planning, **Daily Stand-up** (what I did yesterday / will do today / blockers), Sprint Review (demo), Sprint Retrospective (improve the process).
   - **Artifacts:** Product Backlog, Sprint Backlog, Increment. **User story** format: *"As a [user], I want [goal] so that [benefit]"* + acceptance criteria. Estimation in **story points**. Kanban = continuous flow with WIP limits.

5. **Git basics (very likely: "Have you used Git? What commands?")**
   - **`git init` / `git clone <url>`:** Create / copy a repository
   - **`git status`:** See changes
   - **`git add .`:** Stage changes
   - **`git commit -m "msg"`:** Save a snapshot locally
   - **`git push` / `git pull`:** Upload / download + merge
   - **`git fetch`:** Download without merging
   - **`git branch feature-x` / `git checkout -b feature-x` / `git switch`:** Create / switch branches
   - **`git merge feature-x`:** Merge branch
   - **`git log --oneline`:** History
   - **`git stash`:** Temporarily save uncommitted work
   - **`git reset` / `git revert`:** Undo (reset rewrites history locally; **revert** creates a new undo commit — safe for shared branches)

6. **Git vs GitHub?** Git = distributed version-control tool. GitHub/GitLab/Azure Repos = hosting platforms with pull requests, code review, CI.

7. **`git pull` vs `git fetch`?** Fetch downloads changes only; pull = fetch + merge.

8. **Merge vs Rebase?** Merge keeps both histories with a merge commit; rebase replays your commits on top of another branch for a linear history (never rebase shared public branches).

9. **What is a merge conflict and how do you resolve it?** Two branches changed the same lines. Open the file, pick/combine changes between `<<<<<<<`, `=======`, `>>>>>>>` markers, then `git add` and commit.

10. **What is a Pull Request?** A request to merge your branch into main, where teammates review code and CI runs tests before merging.

## 19. Project & Resume Questions

In fresher interviews, **the project discussion often decides the result**. Every line on your resume is a possible question.

### Prepare a 2-minute project pitch (STAR-like structure)
1. **Problem** — what real problem does it solve and for whom?
2. **Solution & features** — 3–4 key features.
3. **Tech stack & why** — e.g., "ASP.NET Core Web API + SQL Server + React, because…".
4. **Architecture** — frontend → API → database; draw it on paper if asked.
5. **Your role** — what *you* personally built (be honest in team projects).
6. **Challenge & how you solved it** — one specific technical problem.
7. **Result / learning** — what works, what you'd improve.

### Questions you must be ready for
- Explain your project in 2 minutes. *(Practise aloud with a timer.)*
- Why did you choose this technology over alternatives?
- Draw the database schema — what tables, keys and relationships?
- How does login/authentication work in your project? Where are passwords stored? *(Answer: hashed with a salt — bcrypt/PBKDF2 — never plain text.)*
- Show one API endpoint — request, response, status codes.
- What was the hardest bug you faced? How did you debug it?
- How did you test it? *(Mention unit tests, Postman, manual test cases — very relevant for QualiZeal.)*
- If you had more time / 10,000 users, what would you change? *(Indexes, caching, pagination, async, cloud deployment, load balancing.)*
- What did you learn from the project?
- Is it on GitHub/deployed? *(Have the link ready.)*

### Resume tips for this drive
- Highlight **OOP, Java or C#/.NET, SQL, REST APIs, Git**, and any **Cloud/AI** exposure (even certifications like **AZ-900 Azure Fundamentals**, **AWS Cloud Practitioner**, or online AI courses).
- Only list skills you can answer 5 questions on.
- Quantify: "Reduced page load from 4 s to 1.5 s by adding DB indexes and pagination."

## 20. Group Discussion

### How you're evaluated
Content & knowledge · Communication clarity · Listening & building on others · Logical structure · Leadership (initiating, summarising, bringing others in) · Body language · Team behaviour.

### Do's and Don'ts
- **Do:**
   - Open if you have a clear structure ("Let's look at this from 3 angles…")
   - Use facts, examples, data
   - Build on others: "Adding to what Rahul said…"
   - Disagree politely: "I see your point, however…"
   - Invite quiet members
   - Summarise at the end (balanced, both sides)
   - Maintain eye contact with the group, not the panel
- **Don't:**
   - Start if you have nothing solid to say
   - Make up statistics
   - Interrupt or shout
   - Attack people personally
   - Dominate the whole time
   - Introduce new points in the summary
   - Look only at the evaluators

**Useful phrases:** "I'd like to begin by defining…" · "Building on that point…" · "Let's also consider the other side…" · "To bring us back to the topic…" · "To summarise, the group felt that…"

### Topics with talking points (likely for an IT drive in 2026)

**1. Will AI replace software engineers / IT jobs?**
- *For:* AI tools (Copilot, Claude, ChatGPT) already generate code, tests and documentation; routine coding and manual testing jobs are shrinking; companies hire fewer freshers for repetitive work.
- *Against:* AI **augments**, not replaces — it still needs humans for problem definition, architecture, validation, security and accountability; it hallucinates; new roles appear (AI engineer, prompt/QE for AI systems, MLOps).
- *Balanced conclusion:* "AI won't replace engineers, but engineers who use AI will replace those who don't." Upskilling is essential.

**2. Work from home vs work from office**
- WFH: flexibility, no commute, wider talent pool, cost savings. Office: collaboration, mentoring for freshers, culture, focus for some, security.
- Conclusion: hybrid works for experienced staff; **freshers benefit greatly from in-office learning** (relevant — this internship is office-based!).

**3. AI in software testing — boon or bane?** Boon: faster test generation, self-healing scripts, better coverage. Risks: over-reliance, false confidence, AI-generated tests that miss business logic, data privacy. Needs human judgment.

**4. Is a degree necessary for a career in IT?** Skills and projects matter more today; but degrees give fundamentals, structured thinking and are still a filter for hiring.

**5. Cloud computing: is on-premise dead?** Cloud = scalability, pay-per-use; on-premise still used for strict data laws, latency, cost at massive steady scale → hybrid is common.

**6. Social media: boon or bane?** Connectivity, business, awareness vs misinformation, mental health, privacy, addiction.

**7. Data privacy vs convenience** — India's **DPDP Act 2023**; personalised services need data; consent and transparency matter.

**8. Should AI be regulated?** Need for safety, bias control, deepfake prevention vs risk of slowing innovation; EU AI Act as an example of regulation.

**9. Startups vs MNCs for freshers?** Startups: broad learning, ownership, risk. MNCs: structured training, stability, process.

**10. Digital India / UPI — impact on the economy**, **Electric vehicles in India**, **Cybersecurity threats in a digital world**, **Online vs offline education**, **4-day work week**.

**Abstract topics** sometimes appear ("Zero", "Red", "The sky is the limit") — interpret creatively from multiple angles (e.g., "Zero" → invention of zero in India, zero-defect quality, zero-trust security, starting from zero as a fresher).

## 21. HR Interview

Answer honestly, positively, and briefly (60–90 seconds). Use the **STAR** method for behavioural questions: **S**ituation, **T**ask, **A**ction, **R**esult.

1. **Tell me about yourself.**
   *Structure:* Present (degree, college, CGPA) → Skills (language, SQL, APIs) → 1 project highlight → 1 achievement/extra-curricular → why this role.
   *Sample:* "I'm Asha, a final-year B.Tech Computer Science student at RGUKT Nuzvid with a CGPA of 8.6. My strongest language is C#, and I'm comfortable with OOP, SQL and building REST APIs with ASP.NET Core. My main project is a hostel complaint-management system — a .NET Web API with SQL Server and a simple React front end — where I designed the database and wrote the APIs and unit tests. I also enjoy problem-solving; I've solved around 200 problems on LeetCode. I'm excited about this internship because it offers structured training in .NET, Cloud and AI, which is exactly the direction I want my career to take."
   *(Replace with your real details — never memorise word for word.)*

2. **What do you know about QualiZeal? / Why QualiZeal?**
   "QualiZeal is an AI-native digital quality engineering company headquartered in Dallas, with three capability centers here in Hyderabad. It helps global enterprises with test automation, performance, mobile and accessibility testing and digital engineering, and it has built QMentisAI for GenAI-driven testing. I'm attracted by three things: the structured one-year training in .NET/Java, Cloud and AI; the chance to work on global client projects early; and the company's focus on quality — I want to be a developer who builds reliable software, and learning in a quality-first company is the best place for that."

3. **Why should we hire you?**
   Match the INF: "You're looking for strong fundamentals, problem-solving, communication and a willingness to learn. I have solid OOP/SQL basics shown by my projects, I learn quickly — for example I learnt ASP.NET Core on my own in four weeks for my project — and I'm committed to growing with the company long-term."

4. **Are you comfortable with the 2-year bond?** *Expected for this drive.*
   "Yes, absolutely. A year of structured training is a big investment by the company, so a commitment is fair. I'm looking for a place to learn and grow for the long term, not a short stop, so the bond aligns with my own plans."

5. **The stipend is ₹15,000/month during the internship — is that okay?**
   "Yes. At this stage my priority is learning and getting real project experience. The structured training and the PPO opportunity matter more to me than the stipend."

6. **Are you willing to relocate to Hyderabad and work from the office?**
   "Yes. In fact, as a fresher, working from the office with mentors and teammates will help me learn much faster."

7. **Can you manage your final-year academics along with the internship (Sep '26 – Sep '27)?**
   "Yes. I'll plan my time, keep my professors informed, and use weekends for academic work. I understand the internship is a priority and I'm committed to both." *(Clarify with your placement cell how the college handles this before the interview.)*

8. **What are your strengths?** Pick 2–3 relevant ones with **proof**: "quick learner (learnt X in Y weeks)", "persistent problem-solver (debugged … )", "team player (coordinated a 4-person project)".

9. **What is your weakness?** A real but non-critical one + what you're doing about it:
   "I used to hesitate to speak in large groups. I've been working on it by presenting in class seminars and joining our coding club's sessions, and I'm now much more comfortable."
   *(Avoid clichés like "I'm a perfectionist" and anything core to the job, e.g., "I don't like coding".)*

10. **Where do you see yourself in 5 years?**
    "I see myself as a strong full-stack/backend engineer with deep expertise in .NET (or Java) and cloud, contributing to AI-enabled quality engineering solutions, and mentoring new interns like I'll be mentored here — growing within QualiZeal."

11. **Tell me about a challenge/failure you faced.** (STAR) — pick a project bug, a missed deadline, a failed exam or competition; focus on **what you learned and changed**.

12. **Describe a conflict in a team and how you handled it.** Show listening, a fair solution, focus on the goal, no blame.

13. **Do you prefer working alone or in a team?** "Both — I can focus independently on my tasks, but I enjoy teamwork because reviews and discussion make the result better."

14. **How do you handle pressure / tight deadlines?** Break work down, prioritise, communicate early if there's risk, stay calm — with a real example.

15. **Are you ready to work in any technology (e.g., testing instead of development)?**
    "Yes. I want to build strong fundamentals, and testing/automation is a core skill in a QE company — it would make me a better engineer. I'm open to wherever the company needs me." *(Very likely question at a QE company — answer positively.)*

16. **Do you have other offers? / Are you applying elsewhere?** Be honest but show priority: "I'm attending other drives as part of campus placement, but QualiZeal is a strong preference because of the training program in .NET, Cloud and AI."

17. **What do you do in your free time / hobbies?** Have 1–2 genuine ones and be ready for follow-up questions.

18. **What did you learn from the GD/technical round today?** Shows reflection: mention something specific.

19. **How do you keep up with new technologies?** Official docs (Microsoft Learn, Oracle docs), YouTube channels, tech blogs, building small projects, LeetCode, following releases (e.g., .NET 10 LTS, Java 25 LTS).

20. **Do you have any questions for us?** Always ask 1–2. Examples: "What will the first three months of training look like?" · "Which technologies do interns usually work on after training?" · "What qualities have helped past interns convert to full-time roles?"

### HR body-language checklist
Formal clothes, resume copies, ID, pen · Arrive 30 min early · Greet, sit when offered · Eye contact, smile, no fidgeting · Say "I don't know, but I'd like to learn" instead of guessing · Thank the panel at the end.

**Testing:** Verification vs Validation · Severity vs Priority (logo misspelt = low sev, high priority) · Smoke vs Sanity · Regression vs Retesting · BVA & equivalence partitioning · Bug life cycle · Selenium locators/waits/POM · unit test AAA · shift-left.

      const snip = document.createElement("span");
      snip.className = "result-snippet";
      if (first >= 0) {
        const s = Math.max(0, first - 30);
        snip.textContent = (s > 0 ? "…" : "") +
          t.md.slice(s, first + ql.length + 40).replace(/[*`#>|_]/g, "").replace(/\s+/g, " ").trim() + "…";
      }
      const c = document.createElement("span");
      c.className = "result-count";
      c.textContent = " (" + count + ")";
      snip.prepend(c);
      const b = navButton(t, snip);
      b.addEventListener("click", () => { pendingQuery = q; }, true);
      nav.appendChild(b);
    });
    if (!any) nav.innerHTML = '<div class="nav-empty">No matches.</div>';
  }
  let searchTimer;
  search.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderNav, 120); });
  search.addEventListener("keydown", e => {
    if (e.key === "Enter") { const first = nav.querySelector(".nav-item"); if (first) first.click(); }
    if (e.key === "Escape") { search.value = ""; renderNav(); search.blur(); }
  });

  // ---------- routing ----------
  function go(n) {
    const h = n ? "#topic-" + n : "#home";
    if (location.hash === h) route(); else location.hash = h;
  }
  function route() {
    const m = location.hash.match(/^#topic-(\d+)$/);
    const n = m ? +m[1] : 0;
    if (n >= 1 && n <= topics.length) renderTopic(n); else renderHome();
    renderNav();
    window.scrollTo(0, 0);
    if (pendingQuery) { highlight(pendingQuery); pendingQuery = ""; }
    updateReadProgress();
  }
  window.addEventListener("hashchange", route);

  // ---------- self-test helper ----------
  // container gets class "qa"; question parts get "q"; everything else is the answer (hidden in self-test mode)
  function makeQA(container, qParts) {
    container.classList.add("qa");
    qParts.forEach(q => q.classList.add("q"));
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "reveal";
    btn.textContent = "Show answer";
    qParts[qParts.length - 1].after(btn);
    const toggle = () => {
      const open = container.classList.toggle("open");
      btn.textContent = open ? "Hide answer" : "Show answer";
    };
    btn.addEventListener("click", toggle);
    qParts[0].addEventListener("click", e => {
      if (document.body.classList.contains("quiz") && !e.target.closest("a, button")) toggle();
    });
  }

  // ---------- home ----------
  function renderHome() {
    currentTopic = 0;
    document.title = siteTitle;
    $("topbarTitle").textContent = "Home";
    const last = store.get("qz-last", 0);
    page.innerHTML = "";
    const h = document.createElement("h1");
    h.textContent = siteTitle;
    const intro = document.createElement("div");
    intro.className = "md home-intro";
    intro.innerHTML = "<p>Topic-wise preparation: aptitude, programming (OOP, Java, C#/.NET), DSA and coding, " +
      "databases and SQL, APIs, OS and networks, cloud, AI, software testing, group discussion and HR. " +
      "Read one topic at a time and mark it as completed when you're done.</p>";
    const homeHint = document.createElement("div");
    homeHint.className = "quiz-hint";
    homeHint.textContent = "Self-test is on. Open any topic: answers stay hidden until you press \u201cShow answer\u201d.";
    const actions = document.createElement("div");
    actions.className = "home-actions";
    const start = document.createElement("button");
    start.className = "primary-btn";
    start.textContent = last ? "Continue: " + last + ". " + topics[last - 1].title + " →" : "Start with topic 1 →";
    start.addEventListener("click", () => go(last || 1));
    actions.appendChild(start);
    const grid = document.createElement("div");
    grid.className = "grid";
    topics.forEach(t => {
      const c = document.createElement("button");
      c.className = "card" + (done.has(t.num) ? " done" : "");
      const num = document.createElement("span");
      num.className = "nav-num";
      num.textContent = done.has(t.num) ? "✓" : t.num;
      const body = document.createElement("div");
      const tt = document.createElement("div"); tt.className = "card-title"; tt.textContent = t.title;
      const meta = document.createElement("div"); meta.className = "card-meta";
      const bits = [];
      if (t.questions) bits.push(t.questions + " questions");
      if (t.subs) bits.push(t.subs + " sub-topics");
      meta.textContent = bits.join(" · ") || "Reading";
      body.append(tt, meta);
      c.append(num, body);
      c.addEventListener("click", () => go(t.num));
      grid.appendChild(c);
    });
    page.append(h, intro, homeHint, actions, grid);
  }

  // ---------- topic ----------
  function renderTopic(n) {
    currentTopic = n;
    store.set("qz-last", n);
    const t = topics[n - 1];
    document.title = t.num + ". " + t.title + " · Interview Prep";
    $("topbarTitle").textContent = t.num + ". " + t.title;
    page.innerHTML = "";

    const eyebrow = document.createElement("p");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = "Topic " + t.num + " of " + topics.length;
    const h = document.createElement("h1");
    h.textContent = t.title;
    const chips = document.createElement("nav");
    chips.className = "chips";
    const hint = document.createElement("div");
    hint.className = "quiz-hint";
    hint.textContent = "Self-test is on: answer each question in your head first, then press \u201cShow answer\u201d to check.";
    const md = document.createElement("div");
    md.className = "md";
    md.innerHTML = marked.parse(splitQA(t.md));

    // sub-topic chips
    md.querySelectorAll("h3").forEach((el, i) => {
      el.id = "sub-" + (i + 1);
      const c = document.createElement("button");
      c.className = "chip";
      c.textContent = el.textContent.replace(/^\d+\.\d+\s*/, "");
      c.addEventListener("click", () => el.scrollIntoView({ behavior: "smooth", block: "start" }));
      chips.appendChild(c);
    });

    // code: highlight + copy button
    md.querySelectorAll("pre code").forEach(code => {
      if (window.hljs) { try { hljs.highlightElement(code); } catch (e) {} }
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "Copy";
      btn.addEventListener("click", () => {
        const ok = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200); };
        try { navigator.clipboard.writeText(code.innerText).then(ok, () => {}); } catch (e) {}
      });
      code.parentElement.appendChild(btn);
    });

    // external links open in a new tab
    md.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });

    // ----- self-test: mark question + answer parts -----
    // 1) numbered questions:  <li><p><strong|em>Question</…></p> …answer…</li>
    md.querySelectorAll(":scope > ol > li").forEach(li => {
      const p = li.firstElementChild;
      const lead = p && p.firstElementChild;
      if (p && p.tagName === "P" && lead && (lead.tagName === "STRONG" || lead.tagName === "EM") &&
          p.textContent.trim().startsWith(lead.textContent.trim()) && li.children.length > 1) {
        makeQA(li, [p]);
      }
    });
    // 2) output MCQs:  <p><strong>Q1.</strong></p> <pre>code</pre> …explanation…
    [...md.children].forEach(el => {
      if (el.tagName !== "P" || !/^Q\d+\.$/.test(el.textContent.trim())) return;
      const card = document.createElement("div");
      card.className = "mcq-card";
      el.before(card);
      const qParts = [el];
      card.appendChild(el);
      while (card.nextElementSibling && card.nextElementSibling.tagName === "PRE") {
        qParts.push(card.nextElementSibling);
        card.appendChild(card.nextElementSibling);
      }
      let nx = card.nextElementSibling;
      while (nx && !/^H[1-4]$|^HR$/.test(nx.tagName) && !(nx.tagName === "P" && /^Q\d+\.$/.test(nx.textContent.trim()))) {
        card.appendChild(nx);
        nx = card.nextElementSibling;
      }
      if (card.children.length > qParts.length || card.querySelector(".hljs-comment")) makeQA(card, qParts);
    });

    // footer: mark done + prev/next
    const doneRow = document.createElement("div");
    doneRow.className = "done-row";
    const doneBtn = document.createElement("button");
    const paintDone = () => {
      const d = done.has(n);
      doneBtn.className = "done-btn" + (d ? " is-done" : "");
      doneBtn.textContent = d ? "✓ Completed" : "Mark this topic as completed";
    };
    paintDone();
    doneBtn.addEventListener("click", () => { toggleDone(n); paintDone(); renderNav(); });
    doneRow.appendChild(doneBtn);

    const pager = document.createElement("div");
    pager.className = "pager";
    const mk = (cls, dir, target) => {
      const b = document.createElement("button");
      b.className = cls;
      const d = document.createElement("span"); d.className = "dir"; d.textContent = dir;
      const tt = document.createElement("span"); tt.className = "ttl";
      tt.textContent = target ? target.num + ". " + target.title : "Home";
      b.append(d, tt);
      b.addEventListener("click", () => go(target ? target.num : 0));
      return b;
    };
    pager.appendChild(n > 1 ? mk("prev", "← Previous", topics[n - 2]) : mk("prev", "← Back to", null));
    if (n < topics.length) pager.appendChild(mk("next", "Next →", topics[n]));
    const kbd = document.createElement("div");
    kbd.className = "kbd-hint";
    kbd.textContent = "Tip: use the ← and → arrow keys to move between topics.";

    page.append(eyebrow, h, chips, hint, md, doneRow, pager, kbd);
  }

  // ---------- search highlight inside a topic ----------
  function highlight(q) {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    const md = page.querySelector(".md");
    if (!md) return;
    const walker = document.createTreeWalker(md, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) {
      re.lastIndex = 0;
      if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
    }
    nodes.forEach(node => {
      const frag = document.createDocumentFragment();
      const text = node.nodeValue;
      let last = 0;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) {
        frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const mk = document.createElement("mark");
        mk.textContent = m[0];
        frag.appendChild(mk);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
    const first = md.querySelector("mark");
    if (first) {
      const qa = first.closest(".qa");
      if (qa && !qa.classList.contains("open")) { const b = qa.querySelector(".reveal"); if (b) b.click(); }
      setTimeout(() => first.scrollIntoView({ behavior: "smooth", block: "center" }), 50);
    }
  }

  // ---------- keyboard ----------
  document.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" && currentTopic < topics.length) go(currentTopic + 1);
    if (e.key === "ArrowLeft" && currentTopic > 1) go(currentTopic - 1);
    if (e.key === "/") { e.preventDefault(); search.focus(); }
  });

  // ---------- reading progress ----------
  function updateReadProgress() {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    $("readProgress").style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + "%";
  }
  window.addEventListener("scroll", updateReadProgress, { passive: true });

  updateProgress();
  route();
})();
</script>
</body>
</html>
